.pop{background:#1a1a1a;width:100%;max-width:450px;border-radius:20px 20px 0 0;padding:15px;padding-bottom:30px}
.pop img{width:100%;height:220px;object-fit:cover;border-radius:12px}
.btn{display:block;text-align:center;background:#D32F2F;color:#fff;padding:12px;border-radius:10px;text-decoration:none;margin-top:12px;font-weight:800}
