<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hollywood Updates - PRIMAX</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{position:relative;border-radius:10px;overflow:hidden;background:#1a1a1a;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.badge{position:absolute;top:5px;left:5px;background:#D32F2F;color:#fff;font-size:10px;padding:3px 6px;border-radius:4px;font-weight:700}
.rate{position:absolute;top:5px;right:5px;background:#FFC107;color:#000;font-size:11px;padding:3px 6px;border-radius:4px;font-weight:800}
.title{padding:8px;font-size:12px;font-weight:700;text-align:center;min-height:32px}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:99}
.pop{background:#1a1a1a;width:100%;max-width:450px;border-radius:20px 20px 0 0;padding:15px;padding-bottom:30px;max-height:90vh;overflow:auto}
.pop img{width:100%;height:240px;object-fit:cover;border-radius:12px}
.btn{display:block;text-align:center;background:#D32F2F;color:#fff;padding:12px;border-radius:10px;text-decoration:none;margin-top:12px;font-weight:800}
</style></head>
<body>
<h2 style="text-align:center;">🎬 Hollywood Updates</h2>
<p style="text-align:center;color:#aaa;font-size:13px;">Poster eka touch karanna 👇</p>
<p id="status" style="text-align:center;color:#FFC107;font-size:12px;">Loading Auto Updates...</p>
<div class="grid" id="grid"></div>
<div id="popup" onclick="if(event.target==this)closePop()"><div class="pop">
<span style="float:right;font-size:22px;cursor:pointer" onclick="closePop()">✕</span>
<img id="pImg" src=""><h3 id="pTitle"></h3>
<p id="pMeta" style="color:#FFC107;font-size:13px;"></p>
<p id="pDesc" style="color:#ccc;font-size:14px;line-height:1.6;"></p>
<a class="btn" href="#" onclick="alert('Download link laga update karamu!');return false;">⬇️ Download / Watch Now</a>
<a href="index.html" style="display:block;text-align:center;color:#aaa;margin-top:12px;text-decoration:none;">⬅️ Back to Home</a>
</div></div>
<script>
if(!localStorage.getItem("primax_user")){alert("Mulin Login wenna ona!");location.href="index.html";}

// ===== ME THANATA OYA GE API KEY EKA DANNA =====
const API_KEY = "PASTE_YOUR_TMDB_KEY_HERE";
// ===============================================

const STATIC_10 = [
{t:"Avatar 3 - Fire and Ash",img:"https://en.wikipedia.org/wiki/Special:FilePath/Avatar_Fire_and_Ash_poster.jpg",date:"2025-12-19",rate:"8.8",cat:"Sci-Fi",desc:"Fire Na'vi la enawa!"},
{t:"Zootopia 2",img:"https://en.wikipedia.org/wiki/Special:FilePath/Zootopia_2_%282025_film%29.jpg",date:"2025-11-26",rate:"8.5",cat:"Animation",desc:"Judy saha Nick ge aluth case eka!"},
{t:"Wicked - For Good",img:"https://en.wikipedia.org/wiki/Special:FilePath/Wicked_For_Good_poster.jpg",date:"2025-11-21",rate:"8.2",cat:"Musical",desc:"Elphaba saha Glinda ge anthima kathawa!"},
{t:"Predator - Badlands",img:"https://en.wikipedia.org/wiki/Special:FilePath/Predator_Badlands_Poster.jpg",date:"2025-11-07",rate:"7.9",cat:"Action",desc:"Aluth planet ekaka Predator kenek!"},
{t:"Black Phone 2",img:"https://en.wikipedia.org/wiki/Special:FilePath/Black_Phone_2_poster.jpg",date:"2025-10-17",rate:"7.5",cat:"Horror",desc:"Grabber aye enawa!"},
];

let allMovies = STATIC_10;

async function loadAuto(){
  // Key eka nathnam Static witharak pennanna
  if(!API_KEY || API_KEY=="PASTE_YOUR_TMDB_KEY_HERE"){
    document.getElementById("status").innerText="⚠️ API Key nathi nisa Static 5 pennanne - Key eka dammama Auto wenawa!";
    showMovies(); return;
  }
  try{
    // Hamadama aluth Trending Films 20k TMDB eken gannawa
    let res = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}&language=en-US`);
    let data = await res.json();
    if(data.results){
      allMovies = data.results.slice(0,20).map(m=>({
        t:m.title, img:"https://image.tmdb.org/t/p/w500"+m.poster_path,
        date:m.release_date||"2025", rate:m.vote_average?m.vote_average.toFixed(1):"N/A",
        cat:"Hollywood", desc:m.overview||"Hollywood aluth film ekak!"
      }));
      document.getElementById("status").innerText="✅ AUTO UPDATE WELA! - "+new Date().toLocaleDateString()+" - Aluth Films "+allMovies.length+"k";
    }
  }catch(e){
    document.getElementById("status").innerText="⚠️ Internet na, parana ewa pennanne";
  }
  showMovies();
}
function showMovies(){
  document.getElementById("grid").innerHTML=allMovies.map((m,i)=>`<div class="card" onclick="showDetail(${i})"><span class="badge">NEW</span><span class="rate">★ ${m.rate}</span><img src="${m.img}" loading="lazy"><div class="title">${m.t}</div></div>`).join("");
}
function showDetail(i){let m=allMovies[i];document.getElementById("pTitle").innerText=m.t;document.getElementById("pImg").src=m.img;document.getElementById("pMeta").innerText="📅 "+m.date+" | ★ "+m.rate+" | "+m.cat;document.getElementById("pDesc").innerText=m.desc;document.getElementById("popup").style.display="flex";}
function closePop(){document.getElementById("popup").style.display="none";}
loadAuto();
</script>
</body></html>
