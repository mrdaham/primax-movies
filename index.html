<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primax Movies - Login</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0f0f0f;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:#1c1c1c;width:100%;max-width:380px;padding:28px;border-radius:20px;text-align:center}
.logo{font-size:32px;font-weight:900;color:#e50914}
.logo span{color:white}
.sub{color:#aaa;font-size:14px;margin:8px 0 22px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#2a2a2a;color:white;font-size:16px;margin-bottom:12px}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#e50914;color:white;font-size:16px;font-weight:700}
#otpSection{display:none}
#msg{margin-top:14px;font-size:14px;min-height:20px;color:#ffcc00}
#recaptcha-container{margin:10px 0;display:flex;justify-content:center}
.success{color:#00e676!important}
</style>
</head>
<body>
<div class="card">
<div class="logo">PRIMAX <span>MOVIES</span></div>
<div class="sub">Phone Number eken Login Wenna</div>
<div id="phoneSection">
<input id="phone" type="tel" placeholder="+94 7X XXX XXXX" value="+94">
<div id="recaptcha-container"></div>
<button id="sendBtn" onclick="sendOTP()">OTP Yawanna</button>
</div>
<div id="otpSection">
<input id="otp" type="text" placeholder="OTP Code 6 digits" maxlength="6">
<button onclick="verifyOTP()">Verify & Login</button>
<p style="font-size:13px;color:#aaa" onclick="backToPhone()">← Number eka wenas karanna</p>
</div>
<div id="msg"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
apiKey: "AIzaSyD3xuz8MRLEjFFMIuJ8DoIeWH74WVjdt4k",
authDomain: "primax-movies-58f56.firebaseapp.com",
projectId: "primax-movies-58f56",
storageBucket: "primax-movies-58f56.firebasestorage.app",
messagingSenderId: "933755751855",
appId: "1:933755751855:web:d1da202039df46914ff35a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let confirmationResult = null;
let recaptchaVerifier = null;
function showMsg(t, ok=false){
const m = document.getElementById('msg');
m.textContent = t;
m.className = ok ? 'success' : '';
}
window.onload = () => {
recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {'size':'normal','callback':()=>{ showMsg('Captcha hari!'); }});
recaptchaVerifier.render();
};
window.sendOTP = async () => {
const phone = document.getElementById('phone').value.trim();
if(!phone.startsWith('+') || phone.length < 10){ showMsg('Phone number eka +94 wage hariyata gahanna'); return; }
document.getElementById('sendBtn').disabled = true;
showMsg('OTP yawanawa...');
try{
confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
document.getElementById('phoneSection').style.display = 'none';
document.getElementById('otpSection').style.display = 'block';
showMsg('OTP eka yawala! SMS balanna', true);
}catch(e){ showMsg('Error: ' + e.message); document.getElementById('sendBtn').disabled = false; }
};
window.verifyOTP = async () => {
const code = document.getElementById('otp').value.trim();
if(code.length !== 6){ showMsg('OTP 6 digits gahanna'); return; }
showMsg('Checking...');
try{
const result = await confirmationResult.confirm(code);
localStorage.setItem("primax_logged","yes");
localStorage.setItem("primax_phone", result.user.phoneNumber);
showMsg('Login Successful! Home ekata yawanawa...', true);
setTimeout(()=>{ window.location.href = "home.html"; }, 1000);
}catch(e){ showMsg('OTP waradi! ' + e.message); }
};
window.backToPhone = () => {
document.getElementById('otpSection').style.display = 'none';
document.getElementById('phoneSection').style.display = 'block';
document.getElementById('sendBtn').disabled = false;
};
</script>
</body>
</html>
